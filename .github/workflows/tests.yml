name: Tests
on: # this workflow runs on prs and pushes to main
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # step 1: Checkout: copy the repository code at one commit
      - name: Checkout Code
        uses: actions/checkout@v7
      # step 2: setup Java/JDK
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      # step 3: setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      # step 4: Run tests
      - name: Run tests
        run: ./gradlew testDebugUnitTest